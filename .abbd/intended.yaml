revision: 1
units:
    - id: CFG-0001
      kind: CFG
      signature: marketplace abbd {abbd=./plugins/abbd}; plugin abbd
    - id: CFG-0002
      kind: CFG
      signature: '.abbd/project.yaml: extract,verify'
    - id: CFG-0003
      kind: CFG
      signature: PostToolUse[Write|Edit|NotebookEdit] -> abbd hook PostToolUse; PreToolUse[Bash|PowerShell|Write|Edit|NotebookEdit|WebFetch|mcp__.*] -> abbd hook PreToolUse; SessionStart -> abbd hook SessionStart; Stop -> abbd hook Stop; UserPromptSubmit -> abbd hook UserPromptSubmit
    - id: DATA-0007
      kind: DATA
