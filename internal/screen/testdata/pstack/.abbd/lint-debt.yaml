# What the drawings owe the drawing criteria of docs/blueprint-svg.md.
# abbd lint fails on a hard breach past its view's debt, on a weighed sum
# or a count of detours past its ceiling, and on a placement debt more
# than 2% past its ceiling.
# abbd lint --record writes this file from what the drawings measure now,
# and levels from each --keep-level VIEW=REASON.
ceilings:
    detours: 33
    overflow: 0
    placement: 49
    weighed: 1931
debt:
    overview:
        J3: 52
