# What the drawings owe the drawing criteria of docs/blueprint-svg.md.
# abbd lint fails on a hard breach past its view's debt, on a weighed sum
# or a count of tees, excess turns or detours past its ceiling, and on a
# placement debt more than 2% past its ceiling.
# abbd lint --record writes this file from what the drawings measure now,
# and levels from each --keep-level VIEW=REASON.
ceilings:
    against_axis: 4
    detours: 8
    excess_turns: 147
    overflow: 0
    placement: 31
    tees: 0
    weighed: 223
pages:
    overview:
        abreast: 0
        against_axis: 0
        against_axis_ink: 0
        colour_switches: 0
        combs: 0
        counts: 1
        density: 10
        doglegs: 6
        dots: 0
        false_joins: 0
        label_repeats: 1
        labelled: 2
        parallel_ink: 0
