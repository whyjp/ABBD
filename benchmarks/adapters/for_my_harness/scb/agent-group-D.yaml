# Group D: ABBD arm D (skills, hooks, scripts), abbd init once per problem.
# Same fields and values as slop-code-bench configs/agents/claude_code.yaml @ 31ceea3 except version (one
# pinned release for every group), binary, extra_args and env. Image layout: see Dockerfile in this dir.
type: claude_code
binary: /opt/abbd/launch/claude-abbd
permission_mode: bypassPermissions
version: 2.1.302
extra_args: [--plugin-dir, /opt/bench-plugins/D]
env: {ABBD_INIT: "1"}
cost_limits:
  cost_limit: 0
  step_limit: 100
  net_cost_limit: 0
