# UNTESTED. Group D. Same fields as slop-code-bench configs/agents/claude_code.yaml @ 31ceea3 except
# extra_args and env. Pin version to one Claude Code release for every group.
type: claude_code
binary: claude
permission_mode: bypassPermissions
version: ${CLAUDE_CODE_VERSION}
extra_args: [--plugin-dir, /opt/bench-plugins/D]
# Open item: confirm the agent HOME (docker.j2 puts claude in $HOME/.npm-global/bin) and whether env
# replaces or merges PATH. No `abbd init` here: checkpoint 1 starts empty and `abbd run` bootstraps lazily.
env: {PATH: "/home/agent/.npm-global/bin:/opt/abbd/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"}
cost_limits:
  cost_limit: 0
  step_limit: 100
  net_cost_limit: 0
