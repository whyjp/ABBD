# Models for public-benchmark runs. One exact id per comparison; aliases such as `sonnet` are not
# allowed in official runs (the in-house v2 suite used the alias and did not record the resolved id).
# Prices: Anthropic first-party API, from the claude-api reference cached 2026-10-06, read 2026-10-18.
# The primary model is a user decision (see reports/feasibility_and_cost.md section 6).

primary: null            # USER DECISION: claude-sonnet-5-5 or claude-opus-5-5

candidates:
  claude-sonnet-5-5:
    provider: anthropic-api
    price_usd_per_mtok: {input: 2.00, output: 10.00, cache_read: 0.20}
    effort: high          # API default for Sonnet 5.5; recorded verbatim per run
    harbor_model: anthropic/claude-sonnet-5-5
    swe_milestone_model: claude-sonnet-5-5
    scb_model: anthropic/claude-sonnet-5-5   # format per slop-code-bench README example (anthropic/opus-4.5); untested
  claude-opus-5-5:
    provider: anthropic-api
    price_usd_per_mtok: {input: 4.00, output: 20.00, cache_read: 0.20}
    effort: medium        # API default for Opus 5.5 is medium; set explicitly per run
    harbor_model: anthropic/claude-opus-5-5   # this exact slug appears in Harbor README lines 33-40
    swe_milestone_model: claude-opus-5-5
    scb_model: anthropic/claude-opus-5-5

recorded_per_run:
  - model id as sent and as reported in the session result
  - effort / thinking setting
  - claude --version inside the sandbox
  - provider and base URL
  - per-session USD cap (--max-budget-usd), identical across groups

external_comparison_note: >
  No verified Terminal-Bench 2.0 leaderboard row uses a Claude 5.x model. The closest same-harness rows
  are Claude Code 2.1.34 + Claude Opus 4.6 (58.0% +/-2.9) and Claude Code 2.0.72 + Claude Opus 4.5
  (52.1% +/-2.5). Any comparison of our runs to those rows is cross-model and is labelled so.
