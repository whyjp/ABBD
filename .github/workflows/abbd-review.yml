# Posts abbd review as one pull request comment and keeps it current on
# each push. The blueprint stays the current state; the comment is a
# separate view of what the change touched. ABBD reports and never judges,
# so the job never fails the pull request.
name: abbd review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: abbd-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Write the review against the merge base
        run: go run ./cmd/abbd review --markdown --base "${{ github.event.pull_request.base.sha }}" > review.md || true
      - name: Post the comment, or update the one already there
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          test -s review.md || exit 0
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- abbd-review -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@review.md >/dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file review.md
          fi
          exit 0
