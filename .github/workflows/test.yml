# Runs the Go suite on Linux, Windows and macOS. macOS is tested only here.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -timeout 20m ./...
      - name: Digest the synced .abbd output
        if: success() || failure()
        shell: bash
        run: |
          go run ./cmd/abbd sync > /dev/null
          find .abbd -type f | LC_ALL=C sort | while read -r f; do
            echo "$(git hash-object --no-filters "$f") $f"
          done > abbd-digest-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: abbd-digest-${{ matrix.os }}
          path: abbd-digest-${{ matrix.os }}.txt
  # abbd sync writes the same bytes on every OS for this repository's own state.
  same-output:
    needs: test
    if: success() || failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: abbd-digest-*
          merge-multiple: true
      - name: Compare the digests
        run: |
          ls abbd-digest-*.txt
          diff abbd-digest-ubuntu-latest.txt abbd-digest-windows-latest.txt
          diff abbd-digest-ubuntu-latest.txt abbd-digest-macos-latest.txt
