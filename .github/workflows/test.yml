# Runs the Go suite on Linux and Windows. Windows is the base; Linux carries the strict no-skip gates.
# macOS is deferred until after stabilization and is not tested.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      # The cmake front-end needs CMake 4.2 or later; its tests skip on an older one.
      - name: Install CMake 4.2.1
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v4.2.1/cmake-4.2.1-linux-x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-4.2.1-linux-x86_64/bin" >> "$GITHUB_PATH"
      # The rust relater needs rust-analyzer and cargo; its tests skip without them.
      # The pinned release 2026-11-09 is rust-analyzer 0.3.3113, the one the relater was measured with.
      - name: Install rust-analyzer 2026-11-09
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/rust-analyzer"
          cd "$RUNNER_TEMP/rust-analyzer"
          curl -fsSLO https://github.com/rust-lang/rust-analyzer/releases/download/2026-11-09/rust-analyzer-x86_64-unknown-linux-gnu.gz
          echo "8c039b25cb338b3970c731646677a4c9d4e9dd7a92c9ab9ae459c71467fbf4a9  rust-analyzer-x86_64-unknown-linux-gnu.gz" | sha256sum -c
          gunzip -c rust-analyzer-x86_64-unknown-linux-gnu.gz > rust-analyzer
          chmod +x rust-analyzer
          echo "$RUNNER_TEMP/rust-analyzer" >> "$GITHUB_PATH"
          rustup component add rust-src
          "$RUNNER_TEMP/rust-analyzer/rust-analyzer" --version
          cargo --version
      # The c relater needs clangd; its tests skip without it.
      # The pinned release 23.1.0 is the clangd the relater was measured with.
      - name: Install clangd 23.1.0
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) asset=clangd-linux-23.1.0.zip; sha=e53b1a96196095faedb7642cf64964f7fb9ad4a0c1f00dd2c172a3d9dcbafdfd ;;
            Windows) asset=clangd-windows-23.1.0.zip; sha=23412a240756a162e7b98a282f36aa2a23a88db5ce16a0cbc4fef7253768c810 ;;
          esac
          dir="$RUNNER_TEMP/clangd"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSLO "https://github.com/clangd/clangd/releases/download/23.1.0/$asset"
          if command -v sha256sum > /dev/null; then got=$(sha256sum "$asset" | cut -d' ' -f1); else got=$(shasum -a 256 "$asset" | cut -d' ' -f1); fi
          if [ "$got" != "$sha" ]; then echo "$asset sha256 is $got, want $sha"; exit 1; fi
          unzip -q "$asset"
          bin="$dir/clangd_23.1.0/bin"
          if [ "$RUNNER_OS" = Windows ]; then bin=$(cygpath -w "$bin"); fi
          echo "$bin" >> "$GITHUB_PATH"
      # The ts and python relaters need these language servers; their tests skip without them.
      # The pinned versions are the ones the relaters were measured with. TypeScript 7 ships no tsserver.js, so 5.x.
      - name: Install typescript-language-server 6.1.0 and pyright 1.1.414
        shell: bash
        run: |
          npm install -g typescript-language-server@6.1.0 typescript@5.9.3 pyright@1.1.414
          typescript-language-server --version
          command -v pyright-langserver
      - name: go test
        run: go test -timeout 20m ./...
      # The log stays outside the checkout: sync fingerprints every file in it.
      - name: The front-end tests ran, none skipped
        if: runner.os == 'Linux'
        run: |
          cmake --version
          log="$RUNNER_TEMP/frontend.log"
          go test -count=1 -v ./internal/extract/frontend > "$log" || { cat "$log"; exit 1; }
          grep -- '^--- ' "$log"
          if grep -- '--- SKIP' "$log"; then exit 1; fi
      - name: The relater tests ran, none skipped
        if: runner.os == 'Linux'
        run: |
          "$RUNNER_TEMP/rust-analyzer/rust-analyzer" --version
          clangd --version
          typescript-language-server --version
          log="$RUNNER_TEMP/relate.log"
          go test -count=1 -v ./internal/extract/relate ./internal/extract/lsp > "$log" || { cat "$log"; exit 1; }
          if grep -- '--- SKIP' "$log"; then exit 1; fi
      # The rust relater's tests skip here without rust-analyzer; the c, ts and python relaters' must not.
      - name: The c, ts and python relater tests ran, none skipped
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cmake --version
          clangd --version
          typescript-language-server --version
          log="$RUNNER_TEMP/relate-c.log"
          go test -count=1 -v -run 'TestC|TestTS|TestPython' ./internal/extract/relate > "$log" || { cat "$log"; exit 1; }
          grep -- '^--- ' "$log"
          if grep -- '--- SKIP' "$log"; then exit 1; fi
      - name: Digest the synced .abbd output
        if: success() || failure()
        shell: bash
        run: |
          go run ./cmd/abbd sync > /dev/null
          find .abbd -type f | LC_ALL=C sort | while read -r f; do
            echo "$(git hash-object --no-filters "$f") $f"
          done > abbd-digest-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: abbd-digest-${{ matrix.os }}
          path: abbd-digest-${{ matrix.os }}.txt
  # abbd sync writes the same bytes on every OS for this repository's own state.
  same-output:
    needs: test
    if: success() || failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: abbd-digest-*
          merge-multiple: true
      - name: Compare the digests
        run: |
          ls abbd-digest-*.txt
          diff abbd-digest-ubuntu-latest.txt abbd-digest-windows-latest.txt
